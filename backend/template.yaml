AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Contact form backend for Wadaiko Buten website (Lambda + API Gateway + SES)

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address to receive form submissions
    Default: admin@example.com
  SenderEmail:
    Type: String
    Description: Email address to send notifications from (must be verified in SES)
    Default: noreply@example.com
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - production

Resources:
  # Lambda Function
  ContactFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: buten-contact-form
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          NOTIFICATION_EMAIL: !Ref NotificationEmail
          SENDER_EMAIL: !Ref SenderEmail
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        ContactFormApi:
          Type: Api
          Properties:
            Path: /contact
            Method: POST
            RestApiId: !Ref ContactApi
        ContactFormOptions:
          Type: Api
          Properties:
            Path: /contact
            Method: OPTIONS
            RestApiId: !Ref ContactApi

  # API Gateway
  ContactApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ButenContactApi
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'POST, OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ContactApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/contact"

